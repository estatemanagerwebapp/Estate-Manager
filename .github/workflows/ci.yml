name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint / typecheck / test / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  database:
    name: migration + seed (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: silverstone
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/silverstone
      SILVERSTONE_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/silverstone_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Prisma generate
        run: npm run prisma:generate

      - name: Apply migrations
        run: npm run db:deploy

      - name: Seed
        run: npm run db:seed

      - name: Verify the seed is idempotent
        run: npm run db:seed

      - name: Create the test database
        run: psql "postgresql://postgres:postgres@localhost:5432" -c 'CREATE DATABASE silverstone_test'

      - name: Run the Phase 1 integration suite against the test database
        run: npm test -w @silverstone/api

      - name: Boot the API and probe readiness
        run: |
          node apps/api/dist/main.js &
          API_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4000/api/v1/health/ready | grep -q '"status":"ok"'; then
              echo "ready"
              exit 0
            fi
            sleep 1
          done
          echo "API never became ready"
          exit 1
