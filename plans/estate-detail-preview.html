<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Silverstone · Estate workspace preview</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#0d1931;background:#f3f7fa;font-synthesis:none;--ink:#111b31;--muted:#566985;--line:#dfe7ef;--orange:#ff500b;--orange-soft:#fff0e9;--green:#059669;--green-soft:#e4f8ef;--blue-soft:#edf5fc;--white:#fff;--shadow:0 2px 12px rgba(20,39,65,.06)}*{box-sizing:border-box}body{margin:0;min-height:100vh}.app{max-width:1600px;margin:auto;padding:28px 32px 42px}.back{display:inline-flex;gap:9px;align-items:center;color:var(--muted);text-decoration:none;font-size:14px;font-weight:600;margin:0 0 17px}.estate{background:var(--white);border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);overflow:hidden}.estate-head{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:20px 25px;border-bottom:1px solid var(--line)}.titleline{display:flex;align-items:center;gap:11px;flex-wrap:wrap}.home-icon{width:39px;height:39px;display:grid;place-items:center;border-radius:11px;background:var(--orange-soft);color:var(--orange)}h1{font-size:22px;line-height:1.25;margin:0;font-weight:720;letter-spacing:-.025em}.address{font-size:14px;color:var(--muted);margin:5px 0 0 50px}.pill{display:inline-flex;align-items:center;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700;background:var(--green-soft);color:#078052}.head-actions{display:flex;gap:9px;align-items:center}.btn{height:38px;border:1px solid #cfd9e4;background:#fff;color:var(--ink);border-radius:8px;padding:0 14px;font-size:14px;font-weight:650;display:inline-flex;gap:8px;align-items:center;justify-content:center;cursor:pointer}.btn:hover{background:#f8fafc}.btn.primary{background:var(--orange);border-color:var(--orange);color:#fff}.btn.ghost{width:38px;padding:0;font-size:20px}.mobile-select{display:none;padding:14px 16px;border-bottom:1px solid var(--line)}.mobile-select button{width:100%;height:46px;background:#fff;border:1px solid var(--line);border-radius:9px;display:flex;justify-content:space-between;align-items:center;padding:0 13px;color:var(--ink);font-size:16px;font-weight:650}.workspace{display:grid;grid-template-columns:208px minmax(0,1fr);min-height:625px}.side-nav{padding:15px 10px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:3px}.nav-item{height:43px;width:100%;display:flex;align-items:center;gap:11px;padding:0 13px;border:0;border-radius:8px;background:transparent;color:#394d68;text-align:left;font-size:14px;font-weight:550;cursor:pointer}.nav-item svg{color:#637995;flex:none}.nav-item:hover{background:#f7f9fb}.nav-item.active{color:var(--orange);background:var(--orange-soft);font-weight:700;position:relative}.nav-item.active:before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:3px;background:var(--orange);border-radius:0 3px 3px 0}.nav-item.active svg{color:var(--orange)}.nav-divider{height:1px;background:var(--line);margin:12px 7px}.main{padding:24px 25px 32px;min-width:0}.section-head{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;margin-bottom:18px}.section-head h2{font-size:20px;margin:0;letter-spacing:-.02em}.section-head p{margin:5px 0 0;color:var(--muted);font-size:14px}.toolbar{display:flex;gap:10px;align-items:center;margin:0 0 17px;flex-wrap:wrap}.control{height:42px;border:1px solid #d2dce7;border-radius:8px;background:#fff;padding:0 12px;color:#30435f;font-size:14px;min-width:142px}.control.search{min-width:245px;flex:1}.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:#fff}table{border-collapse:collapse;width:100%;text-align:left;min-width:650px}th{height:44px;background:#f7f9fb;color:#62748e;text-transform:uppercase;letter-spacing:.04em;font-size:11px;font-weight:700;padding:0 14px;border-bottom:1px solid var(--line)}td{height:66px;padding:10px 14px;border-bottom:1px solid #edf1f5;font-size:13px;color:#3e526f}tr:last-child td{border-bottom:0}.primary-text{font-weight:650;color:var(--ink)}.secondary{font-size:12px;color:var(--muted);margin-top:3px}.status{display:inline-flex;padding:4px 9px;border-radius:99px;background:var(--green-soft);color:#078052;font-size:11px;font-weight:700}.status.pending{background:#fff6dc;color:#a66b00}.status.muted{background:#eff3f7;color:#65758c}.card{background:#fff;border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow)}.summary-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:15px}.summary{padding:15px 16px;min-height:86px}.summary-label{font-size:12px;color:var(--muted)}.summary-value{font-size:22px;font-weight:730;margin-top:6px}.list{display:grid;gap:10px}.row-card{padding:15px 17px;display:flex;justify-content:space-between;gap:14px;align-items:center}.row-title{font-weight:650;font-size:14px}.row-meta{font-size:12px;color:var(--muted);margin-top:4px}.amount{font-weight:700;white-space:nowrap}.empty{min-height:230px;display:grid;place-items:center;text-align:center;color:var(--muted)}.empty strong{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}.chip-row{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:15px}.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-size:13px;color:#475b77;cursor:pointer}.chip.selected{border-color:#ffc2a9;background:var(--orange-soft);color:#ca3e05;font-weight:650}.subpanel{padding:17px}.subpanel h3{font-size:15px;margin:0 0 12px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.setting-line{display:flex;justify-content:space-between;gap:20px;padding:13px 0;border-bottom:1px solid #edf1f5}.setting-line:last-child{border-bottom:0}.setting-line span:first-child{font-size:13px;font-weight:600}.setting-line span:last-child{font-size:13px;color:var(--muted)}.mobile-nav-list{display:none}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#14233d;color:white;padding:11px 16px;border-radius:9px;font-size:13px;box-shadow:var(--shadow);display:none;z-index:4}.toast.show{display:block}.caption{font-size:11px;color:#8b98aa;text-align:center;margin-top:12px}
@media(max-width:760px){.app{padding:12px 12px 30px}.back{margin:0 0 10px 2px}.estate-head{padding:15px;align-items:flex-start}.home-icon{width:36px;height:36px}h1{font-size:19px}.address{margin:5px 0 0 47px;font-size:13px}.head-actions .label-action{display:none}.head-actions{gap:6px}.head-actions .btn{height:38px;width:40px;padding:0;font-size:18px}.head-actions .btn.ghost{width:38px}.workspace{display:block;min-height:0}.side-nav{display:none}.mobile-select{display:block;position:relative}.main{padding:18px 14px 22px}.section-head{display:block;margin-bottom:14px}.section-head h2{font-size:19px}.section-head .btn{margin-top:13px;width:100%;height:44px}.toolbar{display:grid;grid-template-columns:1fr;gap:8px}.control,.control.search{width:100%;min-width:0;height:46px;font-size:16px}.summary-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.summary{min-height:76px;padding:12px}.summary-value{font-size:20px}.table-wrap{border:0;background:transparent;overflow:visible}table{display:block;min-width:0}thead{display:none}tbody{display:block}.mobile-nav-list{position:absolute;left:0;right:0;top:calc(100% + 5px);z-index:3;background:#fff;border:1px solid var(--line);border-radius:10px;padding:7px;box-shadow:0 10px 30px rgba(20,39,65,.16);display:none;max-height:70vh;overflow:auto}.mobile-nav-list.open{display:block}.mobile-nav-list .nav-item{height:46px;font-size:15px}.mobile-nav-list .nav-divider{margin:7px}.mobile-row{display:block!important;padding:14px!important;margin-bottom:9px;border:1px solid var(--line)!important;border-radius:10px;background:#fff}.mobile-row td{display:block;height:auto;padding:0;border:0!important}.mobile-row td+td{margin-top:7px}.mobile-row td[data-label]:before{content:attr(data-label) ": ";font-size:11px;text-transform:uppercase;color:#8493a7;font-weight:700;margin-right:4px}.row-card{align-items:flex-start;padding:14px}.row-card .right{display:grid;justify-items:end;gap:7px}.form-grid{grid-template-columns:1fr}.setting-line{align-items:flex-start;flex-direction:column;gap:4px}.desktop-only{display:none!important}}
</style>
</head>
<body>
<div class="app">
  <a href="#" class="back" onclick="return false"><span>←</span> Back to estates</a>
  <section class="estate">
    <header class="estate-head">
      <div>
        <div class="titleline"><span class="home-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-6v-7h-4v7H4a1 1 0 0 1-1-1z"/></svg></span><h1>Clove Apartments</h1><span class="pill">ACTIVE</span></div>
        <p class="address">Abijo, Ibeju-Lekki, Lagos</p>
      </div>
      <div class="head-actions"><button class="btn label-action" onclick="toast('Edit estate')">✎ &nbsp;Edit</button><button class="btn label-action" onclick="toast('Archive estate')">▣ &nbsp;Archive</button><button class="btn ghost" onclick="toast('Estate actions')">⋯</button></div>
    </header>
    <div class="mobile-select">
      <button onclick="toggleMobileMenu()"><span id="mobileCurrent">⌂ &nbsp; Properties</span><span>⌄</span></button>
      <div class="mobile-nav-list" id="mobileMenu"></div>
    </div>
    <div class="workspace">
      <nav class="side-nav" id="sideNav" aria-label="Estate sections"></nav>
      <main class="main" id="main"></main>
    </div>
  </section>
  <p class="caption">Interactive layout concept · Sample estate and records for preview</p>
</div>
<div class="toast" id="toast"></div>
<script>
const icons={Properties:'⌂',Billing:'▣',Facilities:'⚒',Bookings:'▦','Gate access':'◫',Activity:'◷',Imports:'⇧',Settings:'⚙'};
const sections=['Properties','Billing','Facilities','Bookings','Gate access','Activity','Imports','Settings'];
let current='Properties';let mobileOpen=false;let bookingFilter='Upcoming';let gateFilter='Access codes';let activityFilter='All activity';
function navMarkup(){return sections.map((s,i)=>`${i===6?'<div class="nav-divider"></div>':''}<button class="nav-item ${current===s?'active':''}" onclick="selectSection('${s}')"><span style="width:18px;text-align:center;font-size:17px">${icons[s]}</span>${s}</button>`).join('')}
function renderNav(){document.getElementById('sideNav').innerHTML=navMarkup();document.getElementById('mobileMenu').innerHTML=navMarkup();document.getElementById('mobileCurrent').innerHTML=`${icons[current]} &nbsp; ${current}`;document.getElementById('mobileMenu').classList.toggle('open',mobileOpen)}
function selectSection(s){current=s;mobileOpen=false;renderNav();renderContent();window.scrollTo({top:0,behavior:'smooth'})}
function toggleMobileMenu(){mobileOpen=!mobileOpen;renderNav()}
function toolbar(...items){return `<div class="toolbar">${items.join('')}</div>`}
function search(ph){return `<input class="control search" placeholder="⌕  ${ph}" oninput="filterRows(this.value)">`}
function select(options){return `<select class="control">${options.map(x=>`<option>${x}</option>`).join('')}</select>`}
function table(headers,rows){return `<div class="table-wrap"><table><thead><tr>${headers.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr class="mobile-row">${row.map((cell,i)=>`<td data-label="${headers[i]}">${cell}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function sectionHead(title,subtitle,action=''){return `<div class="section-head"><div><h2>${title}</h2><p>${subtitle}</p></div>${action}</div>`}
function btn(text,primary=false,click='toast(\'Action\')'){return `<button class="btn ${primary?'primary':''}" onclick="${click}">${text}</button>`}
function status(text,cls=''){return `<span class="status ${cls}">${text}</span>`}
function renderContent(){const root=document.getElementById('main');const pages={
'Properties':()=>`${sectionHead('Properties','Manage homes and residents in this estate.',btn('+ &nbsp; Register property',true,"toast('Register property')"))}${toolbar(select(['All types','House','Apartment','Land']),select(['All statuses','Occupied','Vacant','Archived']),search('Search unit or resident'))}${table(['Unit','Resident','Status','Updated'],[[`<span class="primary-text">A1</span><div class="secondary">2 Bedroom Apartment</div>`,`<span class="primary-text">John Okafor</span><div class="secondary">john.okafor@email.com</div>`,status('Occupied'),'Oct 30, 2026'],[`<span class="primary-text">B2</span><div class="secondary">3 Bedroom Apartment</div>`,`<span class="primary-text">Unassigned</span>`,status('Vacant','muted'),'Oct 29, 2026'],[`<span class="primary-text">C3</span><div class="secondary">1 Bedroom Apartment</div>`,`<span class="primary-text">Amara Adeyemi</span><div class="secondary">amara.ade@email.com</div>`,status('Occupied'),'Oct 28, 2026']])}`,
'Billing':()=>`${sectionHead('Billing','Invoices and recorded payments for Clove Apartments.',btn('+ &nbsp; New invoice',true,"toast('Create estate invoice')"))}<div class="summary-grid"><div class="card summary"><div class="summary-label">Outstanding</div><div class="summary-value">₦1,250,000</div></div><div class="card summary"><div class="summary-label">Unpaid invoices</div><div class="summary-value">8</div></div><div class="card summary"><div class="summary-label">Payments this month</div><div class="summary-value">₦840,000</div></div><div class="card summary"><div class="summary-label">Residents billed</div><div class="summary-value">24</div></div></div>${toolbar(select(['All invoices','Unpaid','Paid','Overdue','Void']),search('Search resident, property or invoice'))}${table(['Invoice','Resident / unit','Due date','Status','Amount'],[[`<span class="primary-text">October security levy</span><div class="secondary">Monthly levy</div>`,`John Okafor<div class="secondary">A1 · Clove Apartments</div>`,'Nov 05, 2026',status('Unpaid','pending'),'<b>₦75,000</b>'],[`<span class="primary-text">Facility maintenance</span><div class="secondary">One-time charge</div>`,`Amara Adeyemi<div class="secondary">C3 · Clove Apartments</div>`,'Oct 30, 2026',status('Paid'),'<b>₦40,000</b>']])}`,
'Facilities':()=>`${sectionHead('Facilities','Manage shared spaces and facility rules for this estate.',btn('+ &nbsp; New facility',true,"toast('Create facility')"))}${toolbar(select(['All facilities','Bookable','Unavailable','Archived']),search('Search facilities'))}<div class="list"><div class="card row-card"><div><div class="row-title">Swimming pool</div><div class="row-meta">Open 06:00–21:00 · Booking required · 2 hour advance notice</div></div><div class="right">${status('Bookable')}<span class="amount">₦5,000 / booking</span></div></div><div class="card row-card"><div><div class="row-title">Community hall</div><div class="row-meta">Open 08:00–22:00 · Booking required · 24 hour advance notice</div></div><div class="right">${status('Bookable')}<span class="amount">₦25,000 / booking</span></div></div><div class="card row-card"><div><div class="row-title">Tennis court</div><div class="row-meta">Open 06:00–20:00 · No booking fee</div></div><div class="right">${status('Bookable')}<span class="amount">Free</span></div></div></div>`,
'Bookings':()=>`${sectionHead('Bookings','Upcoming and past facility bookings in this estate.') }<div class="chip-row">${['Upcoming','Past','All'].map(x=>`<button class="chip ${bookingFilter===x?'selected':''}" onclick="bookingFilter='${x}';renderContent()">${x}</button>`).join('')}</div>${toolbar(select(['All facilities','Swimming pool','Community hall','Tennis court']),select(['All statuses','Requested','Confirmed','Completed','Cancelled']),search('Search resident or facility'))}${table(['Facility','Resident / unit','Date & time','Status','Payment'],[[`<span class="primary-text">Community hall</span>`,`John Okafor<div class="secondary">A1 · Clove Apartments</div>`,'Nov 02 · 14:00–18:00',status('Confirmed'),status('Paid')],[`<span class="primary-text">Swimming pool</span>`,`Amara Adeyemi<div class="secondary">C3 · Clove Apartments</div>`,'Nov 04 · 09:00–10:00',status('Requested','pending'),status('Pending','pending')]])}`,
'Gate access':()=>`${sectionHead('Gate access','Visitor codes and gate verification activity for this estate.') }<div class="chip-row">${['Access codes','Verification log'].map(x=>`<button class="chip ${gateFilter===x?'selected':''}" onclick="gateFilter='${x}';renderContent()">${x}</button>`).join('')}</div>${toolbar(select(['All statuses','Active','Expired','Revoked']),search('Search visitor, resident or unit'))}${gateFilter==='Access codes'?table(['Visitor','Resident / unit','Required check','Validity','Status'],[[`<span class="primary-text">Chinedu Okafor</span><div class="secondary">Code ·••• 8492</div>`,`John Okafor<div class="secondary">A1 · Clove Apartments</div>`,'ID image','Today · 18:30',status('Active')],[`<span class="primary-text">Delivery visitor</span><div class="secondary">Code ·••• 2301</div>`,`Amara Adeyemi<div class="secondary">C3 · Clove Apartments</div>`,'Car plate','Today · 19:00',status('Active')]]):table(['When','Visitor','Resident / unit','Direction','Outcome'],[['Oct 30 · 16:42','Chinedu Okafor','John Okafor · A1','Entry',status('Granted')],['Oct 30 · 15:18','Delivery visitor','Amara Adeyemi · C3','Entry',status('Denied','pending')]])}`,
'Activity':()=>`${sectionHead('Activity','Audit trail for actions and changes in this estate.') }${toolbar(select(['All activity','Residents','Billing','Facilities','Bookings','Gate access']),select(['Any outcome','Completed','Failed']),search('Search actor or activity'))}${table(['When','Activity','Actor','Target','Outcome'],[['Oct 30 · 16:42','access_code.generated<div class="secondary">Visitor code issued</div>','John Okafor','Unit A1',status('Completed')],['Oct 30 · 15:18','invoice.created<div class="secondary">October security levy</div>','Estate Admin','Unit C3',status('Completed')],['Oct 29 · 12:30','booking.confirmed<div class="secondary">Community hall</div>','Estate Admin','Unit B2',status('Completed')]])}`,
'Imports':()=>`${sectionHead('Imports','Review uploaded estate data and import results.',btn('Upload import file',true,"toast('Choose import file')"))}<div class="card subpanel"><h3>Import history</h3>${table(['File','Type','Created','Rows','Status'],[['october-properties.xlsx','Properties','Oct 28, 2026','18',status('Completed')],['resident-update.csv','Residents','Oct 22, 2026','42',status('Completed')]])}</div>`,
'Settings':()=>`${sectionHead('Settings','Configure estate-specific operations and resident experience.') }<div class="card subpanel"><h3>Estate configuration</h3><div class="setting-line"><span>Resident onboarding fee</span><span>₦25,000</span></div><div class="setting-line"><span>Default visitor code validity</span><span>24 hours</span></div><div class="setting-line"><span>Maximum visitor code validity</span><span>7 days</span></div><div class="setting-line"><span>Booking payment required</span><span>Yes</span></div><div class="setting-line"><span>Estate contact email</span><span>office@clove.example</span></div></div>`};root.innerHTML=pages[current]();}
function filterRows(q){const query=q.toLowerCase();document.querySelectorAll('#main tbody tr').forEach(tr=>tr.style.display=tr.innerText.toLowerCase().includes(query)?'':'none')}
let toastTimer;function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),1800)}
renderNav();renderContent();
</script>
</body>
</html>
